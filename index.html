<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Elk Novations — remodeling, construction, and electrical. Quality home improvements across Virginia, Washington, DC, and Maryland."
    />
    <title>Elk Novations | Home Improvement</title>
    <!-- Site content is read from Supabase as soon as the JS loads; open the connection early. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <script>
      // Start each page's critical requests before the app's JavaScript arrives:
      //   "/"      site settings + hero photo               (src/components/Hero.tsx)
      //   "/work"  projects + categories + first project's photos (src/components/WorkPage.tsx)
      // The app reuses these requests (window.__elkSettings / window.__elkEarlyRows, see
      // src/hooks/useSiteData.ts). The image widths/sizes below must match the <SmartImage>
      // props in those components, otherwise the browser downloads the photo twice.
      (function () {
        var base = "%VITE_SUPABASE_URL%".replace(/\/$/, "");
        var key = "%VITE_SUPABASE_ANON_KEY%";
        if (!base || !key || !window.fetch || !window.URL) return;
        var path = location.pathname.replace(/\/+$/, "") || "/";
        var local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        var HERO = { widths: [640, 828, 1080, 1600, 2048], sizes: "(min-width: 1024px) 50vw, 70vw" };
        var CASE = { widths: [640, 828, 1080, 1600], sizes: "(min-width: 1024px) 33vw, 70vw" };
        var preloaded = {};

        function get(query) {
          return fetch(base + "/rest/v1/" + query, {
            headers: { apikey: key, Authorization: "Bearer " + key },
          }).then(function (res) {
            if (!res.ok) throw new Error(query + ": HTTP " + res.status);
            return res.json();
          });
        }
        // Same rules as resizedImageUrl() in src/lib/images.ts.
        function resized(src, w) {
          var u = new URL(src);
          if (u.hostname === "images.unsplash.com") {
            u.searchParams.set("w", String(w));
            u.searchParams.set("q", "75");
            u.searchParams.set("auto", "format");
            return u.toString();
          }
          if (!local && u.origin === base && u.pathname.indexOf("/storage/v1/object/public/") === 0) {
            return "/_vercel/image?url=" + encodeURIComponent(src) + "&w=" + w + "&q=75";
          }
          return null;
        }
        function preload(src, img) {
          try {
            if (!src || preloaded[src] || !resized(src, img.widths[0])) return;
            preloaded[src] = true;
            var link = document.createElement("link");
            link.rel = "preload";
            link.as = "image";
            link.setAttribute("imagesrcset", img.widths.map(function (w) { return resized(src, w) + " " + w + "w"; }).join(", "));
            link.setAttribute("imagesizes", img.sizes);
            link.setAttribute("fetchpriority", "high");
            document.head.appendChild(link);
          } catch (e) {}
        }
        // First URL of an image field (plain URL or JSON array), like parseImageField().
        function firstImage(value) {
          var v = String(value || "").trim();
          if (v.charAt(0) === "[") {
            try {
              var list = JSON.parse(v);
              for (var i = 0; i < list.length; i++) {
                if (typeof list[i] === "string" && list[i].trim()) return list[i].trim();
              }
              return "";
            } catch (e) {}
          }
          return v;
        }
        function preloadHero(settings) {
          if (path === "/" && settings && settings.hero) preload(settings.hero.image, HERO);
        }

        try { preloadHero(JSON.parse(localStorage.getItem("elk:site-settings:v1") || "null")); } catch (e) {}
        window.__elkSettings = get("site_settings?select=key,value").then(function (rows) {
          var map = {};
          rows.forEach(function (row) { map[row.key] = row.value; });
          preloadHero(map);
          return map;
        });
        window.__elkSettings.catch(function () {});

        if (path === "/work") {
          // Same queries (and cache keys) as useWorkCases("all") and useWorkCategories().
          var cases = get("work_cases?select=*,work_categories(id,name,slug)&order=sort_order.asc");
          var categories = get("work_categories?select=*&order=sort_order.asc");
          cases.then(function (rows) {
            if (!rows || !rows[0]) return;
            preload(firstImage(rows[0].before_image_url), CASE);
            preload(firstImage(rows[0].after_image_url), CASE);
          }).catch(function () {});
          categories.catch(function () {});
          window.__elkEarlyRows = {
            "work_cases:all": cases,
            "work_categories?select=*&order=sort_order.asc": categories,
          };
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
